<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Orders</title>

<script>
const API_URL = "http://localhost:8002";
let token = null;

async function login() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    const res = await fetch(`${API_URL}/login`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({username, password})
    });

    const data = await res.json();

    if(res.ok){
        token = data.access_token;
        alert("Logged in");
    }else{
        alert("Login failed");
    }
}

async function addOrder(){
    const foods = document.getElementById("food_names").value.split(",").map(x => x.trim());
    const table = Number(document.getElementById("table_number").value);
    const description = document.getElementById("description").value;

    const payload = {
        food_names: foods,
        table_number: table,
        description: description,
        time: new Date().toISOString(),
        finished: false
    };

    const res = await fetch(`${API_URL}/add_order`, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(payload)
    });

    const data = await res.json();
    alert(JSON.stringify(data));
}

async function viewOrders(){
    const res = await fetch(`${API_URL}/view_orders`);
    const data = await res.json();

    const container = document.getElementById("orders");
    container.innerHTML = "";

    data.forEach(o=>{
        const div = document.createElement("div");
        div.textContent = `ID:${o.id} | Table:${o.table_number} | Foods:${o.food_names.join(",")} | Finished:${o.finished}`;
        container.appendChild(div);
    });
}

async function viewOrder(){
    const id = document.getElementById("view_id").value;

    const res = await fetch(`${API_URL}/view_order/${id}`);
    const data = await res.json();

    document.getElementById("single_order").textContent = JSON.stringify(data);
}

async function updateOrder(){
    const id = document.getElementById("update_id").value;
    const foods = document.getElementById("update_food_names").value.split(",").map(x => x.trim());
    const table = Number(document.getElementById("update_table_number").value);
    const description = document.getElementById("update_description").value;
    const finished = document.getElementById("update_finished").checked;

    const payload = {
        food_names: foods,
        table_number: table,
        description: description,
        time: new Date().toISOString(),
        finished: finished
    };

    const res = await fetch(`${API_URL}/update_odrder/${id}`, {
        method: "PATCH",
        headers:{
            "Content-Type":"application/json",
            "Authorization":`Bearer ${token}`
        },
        body: JSON.stringify(payload)
    });

    const data = await res.json();
    alert(JSON.stringify(data));
}

async function finishOrder(){
    const id = document.getElementById("finish_id").value;

    const res = await fetch(`${API_URL}/finish_order/${id}`,{
        method:"PATCH",
        headers:{
            "Authorization":`Bearer ${token}`
        }
    });

    const data = await res.json();
    alert(JSON.stringify(data));
}
</script>
</head>

<body>

<h2>Login</h2>
<input id="username" placeholder="username">
<input id="password" type="password" placeholder="password">
<button onclick="login()">Login</button>

<h2>Add Order</h2>
<input id="food_names" placeholder="pizza,burger">
<input id="table_number" type="number" placeholder="table">
<input id="description" placeholder="description">
<button onclick="addOrder()">Add Order</button>

<h2>View All Orders</h2>
<button onclick="viewOrders()">Load Orders</button>
<div id="orders"></div>


<h2>View One Order</h2>
<input id="view_id" type="number" placeholder="order id">
<button onclick="viewOrder()">View</button>
<div id="single_order"></div>

<h2>Update Order</h2>
<input id="update_id" type="number" placeholder="order id">
<input id="update_food_names" placeholder="pizza,burger">
<input id="update_table_number" type="number" placeholder="table">
<input id="update_description" placeholder="description">
<label>Finished <input id="update_finished" type="checkbox"></label>
<button onclick="updateOrder()">Update</button>

<h2>Finish Order</h2>
<input id="finish_id" type="number" placeholder="order id">
<button onclick="finishOrder()">Finish</button>

</body>
</html>
