<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Orders</title>

<style>
  *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial, Helvetica, sans-serif;
  }

  .navbar {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 30px;
  }

  .navbar a.back-btn {
      text-decoration: none;
      background: #4a90e2;
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      transition: 0.2s;
  }

  .navbar a.back-btn:hover {
      background: #357bd8;
  }

  .navbar .logo {
      font-size: 24px;
      font-weight: bold;
      color: #333;
  }

  .navbar .login-dropdown {
      margin-left: auto;
      position: relative;
  }

  .navbar .login-dropdown button {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      background: #2ecc71;
      color: white;
      font-weight: bold;
      cursor: pointer;
  }

  .navbar .login-dropdown-content {
      display: none;
      position: absolute;
      right: 0;
      background-color: white;
      min-width: 200px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      border-radius: 6px;
      z-index: 1;
  }

  .navbar .login-dropdown-content input {
      padding: 6px 8px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
  }

  .navbar .login-dropdown-content input:focus {
      outline: none;
      border-color: #4a90e2;
  }

  .navbar .login-dropdown-content button:hover {
      background: #357bd8;
  }

  .navbar .login-dropdown-content div a{
      text-decoration:none;
      color:#333;
  }

  .navbar .login-dropdown:hover .login-dropdown-content {
      display: block;
  }

  body{
      background:#f4f6f9;
      padding:40px;
      display:flex;
      justify-content:center;
  }

  .container{
      width:100%;
      max-width:900px;
      background:white;
      padding:30px;
      border-radius:10px;
      box-shadow:0 8px 25px rgba(0,0,0,0.08);
  }

  h2{
      margin-top:25px;
      margin-bottom:15px;
      color:#333;
      border-bottom:1px solid #eee;
      padding-bottom:6px;
  }

  .section{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-bottom:10px;
  }

  .section input{
      padding:10px;
      border:1px solid #ddd;
      border-radius:6px;
      font-size:14px;
  }

  .section input:focus{
      outline:none;
      border-color:#4a90e2;
  }

  .section button{
      grid-column:span 2;
      padding:10px;
      border:none;
      border-radius:6px;
      background:#4a90e2;
      color:white;
      font-weight:bold;
      cursor:pointer;
      transition:0.2s;
  }

  .section button:hover{
      background:#357bd8;
  }

#orders{
      margin-top:15px;
      display:flex;
      flex-direction:column;
      gap:10px;
  }

#orders div{
      background:#fafafa;
      border:1px solid #eee;
      padding:12px;
      border-radius:6px;
  }

#single_order{
      margin-top:10px;
      background:#fafafa;
      border:1px solid #eee;
      padding:12px;
      border-radius:6px;
      word-break:break-word;
  }

  label{
      display:flex;
      align-items:center;
      gap:6px;
      font-size:14px;
  }

  @media(max-width:700px){

    .section{
        grid-template-columns:1fr;
    }

    .section button{
        grid-column:span 1;
    }

  }
</style>

<script>
const API_URL = "http://localhost:8002";
let token = null;

async function login() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    const res = await fetch(`${API_URL}/login`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({username, password})
    });

    const data = await res.json();

    if(res.ok){
        token = data.access_token;
        alert("Logged in");
    }else{
        alert("Login failed");
    }
}

async function addOrder(){
    const foods = document.getElementById("food_names").value.split(",").map(x => x.trim());
    const table = Number(document.getElementById("table_number").value);
    const description = document.getElementById("description").value;

    const payload = {
        food_names: foods,
        table_number: table,
        description: description,
        time: new Date().toISOString(),
        finished: false
    };

    const res = await fetch(`${API_URL}/add_order`, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(payload)
    });

    const data = await res.json();
    alert(JSON.stringify(data));
}

async function viewOrders(){
    const res = await fetch(`${API_URL}/view_orders`);
    const data = await res.json();

    const container = document.getElementById("orders");
    container.innerHTML = "";

    data.forEach(o=>{
        const div = document.createElement("div");
        div.textContent = `ID:${o.id} | Table:${o.table_number} | Foods:${o.food_names.join(",")} | Finished:${o.finished}`;
        container.appendChild(div);
    });
}

async function viewOrder(){
    const id = document.getElementById("view_id").value;

    const res = await fetch(`${API_URL}/view_order/${id}`);
    const data = await res.json();

    document.getElementById("single_order").textContent = JSON.stringify(data);
}

async function updateOrder(){
    const id = document.getElementById("update_id").value;
    const foods = document.getElementById("update_food_names").value.split(",").map(x => x.trim());
    const table = Number(document.getElementById("update_table_number").value);
    const description = document.getElementById("update_description").value;
    const finished = document.getElementById("update_finished").checked;

    const payload = {
        food_names: foods,
        table_number: table,
        description: description,
        time: new Date().toISOString(),
        finished: finished
    };

    const res = await fetch(`${API_URL}/update_odrder/${id}`, {
        method: "PATCH",
        headers:{
            "Content-Type":"application/json",
            "Authorization":`Bearer ${token}`
        },
        body: JSON.stringify(payload)
    });

    const data = await res.json();
    alert(JSON.stringify(data));
}

async function finishOrder(){
    const id = document.getElementById("finish_id").value;

    const res = await fetch(`${API_URL}/finish_order/${id}`,{
        method:"PATCH",
        headers:{
            "Authorization":`Bearer ${token}`
        }
    });

    const data = await res.json();
    alert(JSON.stringify(data));
}
</script>
</head>

<body>

<div class="container">

    <div class="navbar">
        <a href="index.html" class="back-btn">Main</a>
        <div class="logo">Orders</div>

        <div class="login-dropdown">
            <button>Login ▼</button>
            <div class="login-dropdown-content">
                <div style="display:flex; flex-direction:column; gap:8px; padding:10px;">
                    <input id="username" placeholder="Username" required>
                    <input id="password" type="password" placeholder="Password" required>
                    <button onclick="login()" style="background:#4a90e2; color:white; border:none; padding:8px; border-radius:5px; cursor:pointer;">Login</button>
                </div>
            </div>
        </div>
    </div>

    <h2>Add Order</h2>
    <div class="section">
        <input id="food_names" placeholder="pizza,burger">
        <input id="table_number" type="number" placeholder="table">
        <input id="description" placeholder="description">
        <button onclick="addOrder()">Add Order</button>
    </div>

    <h2>View All Orders</h2>
    <div class="section">
        <button onclick="viewOrders()">Load Orders</button>
    </div>

    <div id="orders"></div>

    <h2>View One Order</h2>
    <div class="section">
        <input id="view_id" type="number" placeholder="order id">
        <button onclick="viewOrder()">View</button>
    </div>

    <div id="single_order"></div>

    <h2>Update Order</h2>
    <div class="section">
        <input id="update_id" type="number" placeholder="order id">
        <input id="update_food_names" placeholder="pizza,burger">
        <input id="update_table_number" type="number" placeholder="table">
        <input id="update_description" placeholder="description">
        <label>Finished <input id="update_finished" type="checkbox"></label>
        <button onclick="updateOrder()">Update</button>
    </div>

    <h2>Finish Order</h2>
    <div class="section">
        <input id="finish_id" type="number" placeholder="order id">
        <button onclick="finishOrder()">Finish</button>
    </div>

</div>

</body>
</html>
