<!DOCTYPE html>
<html>
<head>
    <title>Menu</title>
    <style>
        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
            font-family:Arial, Helvetica, sans-serif;
        }

        .navbar {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .navbar a.back-btn {
            text-decoration: none;
            background: #4a90e2;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            transition: 0.2s;
        }

        .navbar a.back-btn:hover {
            background: #357bd8;
        }

        .navbar .logo {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .navbar .login-dropdown {
            margin-left: auto;
            position: relative;
        }

        .navbar .login-dropdown button {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            background: #2ecc71;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .navbar .login-dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: white;
            min-width: 150px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            border-radius: 6px;
            z-index: 1;
        }

        .navbar .login-dropdown-content a {
            color: #333;
            padding: 10px 12px;
            text-decoration: none;
            display: block;
        }

        .navbar .login-dropdown-content a:hover {
            background-color: #f1f1f1;
        }

        .navbar .login-dropdown:hover .login-dropdown-content {
            display: block;
        }

        body{
            background:#f4f6f9;
            padding:40px;
            display:flex;
            justify-content:center;
        }

        .container{
            width:100%;
            max-width:900px;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 8px 25px rgba(0,0,0,0.08);
        }

        h2{
            margin-top:25px;
            margin-bottom:15px;
            color:#333;
            border-bottom:1px solid #eee;
            padding-bottom:5px;
        }

        form{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:12px;
            margin-bottom:10px;
        }

        form input, form select{
            padding:10px;
            border:1px solid #ddd;
            border-radius:6px;
            font-size:14px;
        }

        form input:focus, form select:focus{
            outline:none;
            border-color:#4a90e2;
        }

        form button{
            grid-column:span 2;
            padding:10px;
            border:none;
            border-radius:6px;
            background:#4a90e2;
            color:white;
            font-weight:bold;
            cursor:pointer;
            transition:0.2s;
        }

        form button:hover{
            background:#357bd8;
        }

        #refreshBtn{
            margin-top:10px;
            margin-bottom:15px;
            padding:8px 14px;
            border:none;
            border-radius:6px;
            background:#2ecc71;
            color:white;
            font-weight:bold;
            cursor:pointer;
        }

        #refreshBtn:hover{
            background:#27ae60;
        }

        ul{
            list-style:none;
            padding:0;
        }

        .menu-toolbar{
            display:flex;
            gap:10px;
            margin-bottom:15px;
        }

        .menu-toolbar button{
            padding:8px 12px;
            border:none;
            border-radius:6px;
            background:#3498db;
            color:white;
            cursor:pointer;
        }

        .menu-toolbar button:hover{
            background:#2980b9;
        }

        li{
            background:white;
            border:1px solid #eee;
            padding:14px;
            border-radius:8px;
            margin-bottom:10px;

            display:grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            align-items:center;
            gap:10px;

            box-shadow:0 2px 6px rgba(0,0,0,0.05);
        }

        .item-info{
            display:flex;
            flex-direction:column;
        }

        .item-name{
            font-weight:bold;
            font-size:16px;
        }

        .item-category{
            font-size:12px;
            color:#777;
        }

        .item-price{
            font-weight:bold;
            color:#27ae60;
        }

        .item-status{
            font-size:12px;
        }

        .item-actions{
            display:flex;
            gap:6px;
        }

        .item-actions button{
            padding:6px 10px;
            border:none;
            border-radius:5px;
            font-size:12px;
            cursor:pointer;
        }

        .delete-btn{
            background:#e74c3c;
            color:white;
        }

        .delete-btn:hover{
            background:#c0392b;
        }

        .toggle-btn{
            background:#f39c12;
            color:white;
        }

        .toggle-btn:hover{
            background:#d68910;
        }
       @media(max-width:700px){
            form{
                grid-template-columns:1fr;
            }

            form button{
                grid-column:span 1;
            }

            li{
              grid-template-columns:1fr;
            }

            .item-actions{
                margin-top:8px;
            }
        }

        #toast-container{
            position:fixed;
            top:20px;
            right:20px;
            display:flex;
            flex-direction:column;
            gap:10px;
            z-index:9999;
        }

        .toast{
            min-width:220px;
            padding:12px 16px;
            border-radius:8px;
            color:white;
            font-size:14px;
            font-weight:bold;
            box-shadow:0 6px 15px rgba(0,0,0,0.15);
            animation:slideIn 0.3s ease;
        }

        .toast.success{ background:#2ecc71; }
        .toast.error{ background:#e74c3c; }
        .toast.warning{ background:#f39c12; }

        @keyframes slideIn{
            from{
                opacity:0;
                transform:translateX(30px);
            }
            to{
                opacity:1;
                transform:translateX(0);
            }
        }
    </style>
</head>
<body>

<div class="container">

    <div class="navbar">
        <a href="index.html" class="back-btn">Main</a>
        <div class="logo">Menu</div>

        <div class="login-dropdown">
            <button>Login ▼</button>
            <div class="login-dropdown-content">
                <form id="loginForm" style="display:flex; flex-direction:column; gap:8px; padding:10px;">
                    <input type="text" id="username" placeholder="Username" required>
                    <input type="password" id="password" placeholder="Password" required>
                    <button type="submit" style="background:#4a90e2; color:white; border:none; padding:8px; border-radius:5px; cursor:pointer;">Login</button>
                </form>
            </div>
        </div>
    </div>

    <h2>Add Menu Item</h2>
    <form id="addForm">
        <input type="text" id="food_name" placeholder="Food Name" required>
        <input type="text" id="category" placeholder="Category" required>
        <input type="number" id="price" placeholder="Price" required>
        <input type="text" id="ingredients" placeholder="Ingredients" required>
        <input type="text" id="allergies" placeholder="Allergies">
        <select id="availability">
            <option value="True">Available</option>
            <option value="False">Not Available</option>
        </select>
        <button type="submit">Add Item</button>
    </form>

    <h2>Menu Items</h2>

    <div class="menu-toolbar">
        <button onclick="setSort('category')">Group by Category</button>
        <button onclick="setSort('priceAsc')">Price ↑</button>
        <button onclick="setSort('priceDesc')">Price ↓</button>
        <button onclick="setSort('nameAsc')">Name A-Z</button>
    </div>

    <button id="refreshBtn">Refresh Menu</button>

    <ul id="menuList"></ul>

</div>

<script>
let token = "";

document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    const res = await fetch("http://localhost:8001/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({username, password})
    });

    const data = await res.json();
    if(res.ok){
        token = data.access_token;
        showToast("Login successful!", "success");
    } else {
        showToast(data.detail || "Login failed", "error");
    }
});

document.getElementById("addForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    if(!token){ showToast("Please login first!", "warning"); return; }

    const food_name = document.getElementById("food_name").value;
    const category = document.getElementById("category").value;
    const price = parseFloat(document.getElementById("price").value);
    const ingredients = document.getElementById("ingredients").value
        .split(",")
        .map(s => s.trim())
        .filter(s => s);
    const allergies = document.getElementById("allergies").value
        .split(",")
        .map(s => s.trim())
        .filter(s => s);
    const availability = document.getElementById("availability").value === "True";

    const res = await fetch("http://localhost:8001/new_item", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
        },
        body: JSON.stringify({food_name, category, price, ingredients, allergies, availability})
    });

    const data = await res.json();
    showToast("Item added!", "success");
    fetchMenu();
});

let currentSort = null;

function setSort(type){
    currentSort = type;
    fetchMenu();
}

async function fetchMenu(){

    const res = await fetch("http://localhost:8001/get_menu");
    let items = await res.json();

    // sorting
    if(currentSort === "priceAsc"){
        items.sort((a,b)=>a.price-b.price);
    }

    if(currentSort === "priceDesc"){
        items.sort((a,b)=>b.price-a.price);
    }

    if(currentSort === "nameAsc"){
        items.sort((a,b)=>a.food_name.localeCompare(b.food_name));
    }

    if(currentSort === "category"){
        items.sort((a,b)=>a.category.localeCompare(b.category));
    }

    const ul = document.getElementById("menuList");
    ul.innerHTML = "";

    items.forEach(item => {

        const li = document.createElement("li");

        const info = document.createElement("div");
        info.className = "item-info";

        const name = document.createElement("div");
        name.className = "item-name";
        name.textContent = item.food_name;

        const category = document.createElement("div");
        category.className = "item-category";
        category.textContent = item.category;

        info.appendChild(name);
        info.appendChild(category);

        const price = document.createElement("div");
        price.className = "item-price";
        price.textContent = "$" + item.price;

        const status = document.createElement("div");
        status.className = "item-status";
        status.textContent = item.availability ? "Available" : "Unavailable";

        const actions = document.createElement("div");
        actions.className = "item-actions";

        const delBtn = document.createElement("button");
        delBtn.className = "delete-btn";
        delBtn.textContent = "Delete";

        delBtn.onclick = async () => {
            if(!token){ showToast("Please login first!", "warning"); return; }

            const res = await fetch(`http://localhost:8001/delete_item/${item.id}`, {
                method:"DELETE",
                headers:{ "Authorization": "Bearer " + token }
            });

            const data = await res.json();
            showToast(data.message,"success");
            fetchMenu();
        };

        const patchBtn = document.createElement("button");
        patchBtn.className = "toggle-btn";
        patchBtn.textContent = "Toggle";

        patchBtn.onclick = async () => {

            if(!token){ showToast("Please login first!", "warning"); return; }

            const res = await fetch(`http://localhost:8001/patch_item/${item.id}`,{
                method:"PATCH",
                headers:{
                    "Authorization":"Bearer "+token,
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({availability:!item.availability})
            });

            const data = await res.json();
            showToast(data.message,"success");
            fetchMenu();
        };

        actions.appendChild(delBtn);
        actions.appendChild(patchBtn);

        li.appendChild(info);
        li.appendChild(price);
        li.appendChild(status);
        li.appendChild(actions);

        ul.appendChild(li);
    });
}

document.getElementById("refreshBtn").addEventListener("click", fetchMenu);

fetchMenu();

function showToast(message, type="success", duration=3000){
const container = document.getElementById("toast-container");

const toast = document.createElement("div");
toast.className = `toast ${type}`;
toast.textContent = message;

container.appendChild(toast);

setTimeout(() => {
    toast.style.opacity = "0";
    toast.style.transform = "translateX(30px)";
    setTimeout(()=> toast.remove(),300);
}, duration);
}
</script>

<div id="toast-container"></div>

  </body>
</html>
