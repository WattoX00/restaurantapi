<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Statistics</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
    *{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial, Helvetica, sans-serif;
    }

    .navbar {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 30px;
    }

    .navbar a.back-btn {
        text-decoration: none;
        background: #4a90e2;
        color: white;
        padding: 8px 12px;
        border-radius: 6px;
        font-weight: bold;
        transition: 0.2s;
    }

    .navbar a.back-btn:hover {
        background: #357bd8;
    }

    .navbar .logo {
        font-size: 24px;
        font-weight: bold;
        color: #333;
    }

    .navbar .login-dropdown {
        margin-left: auto;
        position: relative;
    }

    .navbar .login-dropdown button {
        padding: 8px 12px;
        border: none;
        border-radius: 6px;
        background: #2ecc71;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }

    .navbar .login-dropdown-content {
        display: none;
        position: absolute;
        right: 0;
        background-color: white;
        min-width: 200px;
        box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        border-radius: 6px;
        z-index: 1;
    }

    .navbar .login-dropdown-content input {
        padding: 6px 8px;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-size: 14px;
    }

    .navbar .login-dropdown-content input:focus {
        outline: none;
        border-color: #4a90e2;
    }

    .navbar .login-dropdown-content button:hover {
        background: #357bd8;
    }

    .navbar .login-dropdown:hover .login-dropdown-content {
        display: block;
    }

    body{
      background:#f4f6f9;
      padding:40px;
      display:flex;
      justify-content:center;
    }

    .container{
      width:100%;
      max-width:1000px;
      background:white;
      padding:30px;
      border-radius:10px;
      box-shadow:0 8px 25px rgba(0,0,0,0.08);
    }

    h2{
      margin-top:30px;
      margin-bottom:15px;
      color:#333;
      border-bottom:1px solid #eee;
      padding-bottom:6px;
    }

    .section{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-bottom:10px;
    }

  .section input{
    padding:10px;
    border:1px solid #ddd;
    border-radius:6px;
    font-size:14px;
  }

  .section input:focus{
    outline:none;
    border-color:#4a90e2;
  }

  .section button{
    grid-column:span 2;
    padding:10px;
    border:none;
    border-radius:6px;
    background:#4a90e2;
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
  }

  .section button:hover{
    background:#357bd8;
  }

  .result{
    margin-top:15px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .result div{
    background:#fafafa;
    border:1px solid #eee;
    padding:10px;
    border-radius:6px;
  }

  .chart-container{
    margin-top:20px;
    background:#fafafa;
    border:1px solid #eee;
    border-radius:8px;
    padding:20px;
  }

  canvas{
  max-width:100%;
  }

  @media(max-width:700px){

    .section{
    grid-template-columns:1fr;
    }

    .section button{
    grid-column:span 1;
    }

  }
  #toast-container{
    position:fixed;
    top:20px;
    right:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
    z-index:9999;
  }

  .toast{
      min-width:220px;
      padding:12px 16px;
      border-radius:8px;
      color:white;
      font-size:14px;
      font-weight:bold;
      box-shadow:0 6px 15px rgba(0,0,0,0.15);
      animation:slideIn 0.3s ease;
  }

  .toast.success{ background:#2ecc71; }
  .toast.error{ background:#e74c3c; }
  .toast.warning{ background:#f39c12; }

  @keyframes slideIn{
      from{
          opacity:0;
          transform:translateX(30px);
      }
      to{
          opacity:1;
          transform:translateX(0);
      }
  }
</style>

<script>
const API_URL = "http://127.0.0.1:8003";
let token = "";

let mostChart = null;
let leastChart = null;
let monthlyChart = null;

function setTodayDefaults(){
    const today = new Date().toISOString().split("T")[0];
    document.getElementById("most_end").value = today;
    document.getElementById("least_end").value = today;
}

async function login() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    const res = await fetch(`${API_URL}/login`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({username, password})
    });

    const data = await res.json();

    if(res.ok){
        token = data.access_token;
        showToast("Login successful!", "success");
    }else{
        showToast(data.detail || "Login failed", "error");
    }
}

async function mostSold(){
    const start = document.getElementById("most_start").value;
    const end = document.getElementById("most_end").value;

    const res = await fetch(API_URL + "/most_items_sold?start_date=" + start + "&end_date=" + end, {
        method: "GET",
        headers: {"Authorization":"Bearer " + token}
    });

    const data = await res.json();

    if(data.detail && data.detail.toLowerCase().includes("token")){
        showToast("Invalid token. Please login.", "error");
        return;
    }

    const container = document.getElementById("most_result");
    container.innerHTML = "";

    const labels = [];
    const quantities = [];

    data.forEach(item=>{
        const div = document.createElement("div");
        div.textContent = "Food: " + item.food_name + " | Quantity: " + item.quantity + " | Revenue: " + item.revenue;
        container.appendChild(div);

        labels.push(item.food_name);
        quantities.push(item.quantity);
    });

    if(mostChart) mostChart.destroy();

    const ctx = document.getElementById("most_chart").getContext("2d");
    mostChart = new Chart(ctx,{
        type:"bar",
        data:{
            labels:labels,
            datasets:[{
                label:"Quantity Sold",
                data:quantities
            }]
        },
        options:{
            responsive:true,
            plugins:{legend:{display:true}}
        }
    });
}

async function leastSold(){
    const start = document.getElementById("least_start").value;
    const end = document.getElementById("least_end").value;

    const res = await fetch(API_URL + "/least_items_sold?start_date=" + start + "&end_date=" + end, {
        method: "GET",
        headers: {"Authorization":"Bearer " + token}
    });

    const data = await res.json();

    if(data.detail && data.detail.toLowerCase().includes("token")){
        showToast("Invalid token. Please login.", "error");
        return;
    }
    const container = document.getElementById("least_result");
    container.innerHTML = "";

    const labels = [];
    const quantities = [];

    data.forEach(item=>{
        const div = document.createElement("div");
        div.textContent = "Food: " + item.food_name + " | Quantity: " + item.quantity + " | Revenue: " + item.revenue;
        container.appendChild(div);

        labels.push(item.food_name);
        quantities.push(item.quantity);
    });

    if(leastChart) leastChart.destroy();

    const ctx = document.getElementById("least_chart").getContext("2d");
    leastChart = new Chart(ctx,{
        type:"bar",
        data:{
            labels:labels,
            datasets:[{
                label:"Quantity Sold",
                data:quantities
            }]
        },
        options:{
            responsive:true
        }
    });
}

async function monthlyData() {
    const dateInput = document.getElementById("monthPicker").value;

    if (!dateInput) {
       showToast("Please select a date.", "error");        return;
    }

    const [yearStr, monthStr] = dateInput.split("-");
    const year = parseInt(yearStr);
    const month = parseInt(monthStr) - 1;
    const res = await fetch(`${API_URL}/monthly_data?year=${year}&month=${month}`, {
        method: "GET",
        headers: { "Authorization": "Bearer " + token }
    });

    const data = await res.json();
    if(data.detail && data.detail.toLowerCase().includes("token")){
        showToast("Invalid token. Please login.", "error");
        return;
    }
    const container = document.getElementById("monthly_result");
    container.innerHTML = `
        <div>Total Revenue: ${data.total_revenue}</div>
        <div>Morning Revenue: ${data.morning}</div>
        <div>Noon Revenue: ${data.noon}</div>
        <div>Afternoon Revenue: ${data.afternoon}</div>
    `;

    if (monthlyChart) monthlyChart.destroy();

    const ctx = document.getElementById("monthly_chart").getContext("2d");
    monthlyChart = new Chart(ctx, {
        type: "pie",
        data: {
            labels: ["Morning", "Noon", "Afternoon"],
            datasets: [{ data: [data.morning, data.noon, data.afternoon] }]
        },
        options: { responsive: true }
    });
}

function showToast(message, type="success", duration=3000){
    const container = document.getElementById("toast-container");

    const toast = document.createElement("div");
    toast.className = `toast ${type}`;
    toast.textContent = message;

    container.appendChild(toast);

    setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateX(30px)";
        setTimeout(()=> toast.remove(),300);
    }, duration);
}
</script>
</head>

<body onload="setTodayDefaults()">

<div class="container">

    <div class="navbar">
        <a href="index.html" class="back-btn">Main</a>
        <div class="logo">Statistics</div>
        
        <div class="login-dropdown">
            <button>Login ▼</button>
            <div class="login-dropdown-content">
                <div style="display:flex; flex-direction:column; gap:8px; padding:10px;">
                    <input id="username" placeholder="Username" required>
                    <input id="password" type="password" placeholder="Password" required>
                    <button onclick="login()" style="background:#4a90e2; color:white; border:none; padding:8px; border-radius:5px; cursor:pointer;">Login</button>
                </div>
            </div>
        </div>
    </div>

    <h2>Most Sold Items</h2>
    <div class="section">
        <input id="most_start" type="date">
        <input id="most_end" type="date">
        <button onclick="mostSold()">Get Most Sold</button>
    </div>

    <div id="most_result" class="result"></div>
        <div class="chart-container">
        <canvas id="most_chart"></canvas>
    </div>

    <h2>Least Sold Items</h2>
    <div class="section">
        <input id="least_start" type="date">
        <input id="least_end" type="date">
        <button onclick="leastSold()">Get Least Sold</button>
    </div>
    <div id="least_result" class="result"></div>
        <div class="chart-container">
        <canvas id="least_chart"></canvas>
    </div>


    <h2>Monthly Data</h2>
    <div class="section">
        <input id="monthPicker" type="month" placeholder="YYYY-MM">
        <button onclick="monthlyData()">Get Monthly Data</button>
    </div>

    <div id="monthly_result" class="result"></div>
    <div class="chart-container">
        <canvas id="monthly_chart"></canvas>
    </div>

</div>

<div id="toast-container"></div>

</body>
</html>
