<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Orders</title>
    
<link rel="stylesheet" href="orders.css">
</head>

<body>

<div class="container">

<div class="navbar">
    <a href="../index.html" class="back-btn">Main</a>
    <div class="logo">Orders</div>

    <div class="login-dropdown">
        <button>Login ▼</button>
        <div class="login-dropdown-content">
            <div style="display:flex; flex-direction:column; gap:8px; padding:10px;">
                <input id="username" placeholder="Username" required>
                <input id="password" type="password" placeholder="Password" required>
                <button onclick="login()" style="background:#4a90e2; color:white; border:none; padding:8px; border-radius:5px; cursor:pointer;">Login</button>
            </div>
        </div>
    </div>
</div>

<h2>Add Order</h2>
<div class="section">
    <input id="food_names" placeholder="pizza,burger">
    <input id="table_number" type="number" placeholder="table">
    <input id="description" placeholder="description">
    <button onclick="addOrder()">Add Order</button>
</div>

<h2>View All Orders</h2>
<div class="section">
    <button onclick="viewOrders()">Load Orders</button>
</div>

<div id="orders"></div>

<h2>View Finished Orders</h2>
<div class="section">
    <button onclick="viewFinishedOrders()">Load Finished Orders</button>
</div>

<div id="finished_orders"></div>

<h2>View One Order</h2>
<div class="section">
    <input id="view_id" type="number" placeholder="order id">
    <button onclick="viewOrder()">View</button>
</div>

<div id="single_order"></div>

<h2>Update Order</h2>
<div class="section">
    <input id="update_id" type="number" placeholder="order id">
    <input id="update_food_names" placeholder="pizza,burger">
    <input id="update_table_number" type="number" placeholder="table">
    <input id="update_description" placeholder="description">
    <label>Finished <input id="update_finished" type="checkbox"></label>
    <button onclick="updateOrder()">Update</button>
</div>

<h2>Finish Order</h2>
<div class="section">
    <input id="finish_id" type="number" placeholder="order id">
    <button onclick="finishOrder()">Finish</button>
</div>

</div>

<div id="toast-container"></div>

<script src="../script.js"></script>

</body>
</html>
