<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Statistics</title>

<link rel="stylesheet" href="statistics.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="statistics.js"></script>

</head>

<body onload="setTodayDefaults()">

<div class="container">

<div class="navbar">
    <a href="../index.html" class="back-btn">Main</a>
    <div class="logo">Statistics</div>
    
    <div class="login-dropdown">
        <button>Login ▼</button>
        <div class="login-dropdown-content">
            <div style="display:flex; flex-direction:column; gap:8px; padding:10px;">
                <input id="username" placeholder="Username" required>
                <input id="password" type="password" placeholder="Password" required>
                <button onclick="login()" style="background:#4a90e2; color:white; border:none; padding:8px; border-radius:5px; cursor:pointer;">Login</button>
            </div>
        </div>
    </div>
</div>

<h2>Most Sold Items</h2>
<div class="section">
    <input id="most_start" type="date">
    <input id="most_end" type="date">
    <button onclick="mostSold()">Get Most Sold</button>
</div>

<div id="most_result" class="result"></div>
    <div class="chart-container">
    <canvas id="most_chart"></canvas>
</div>

<h2>Least Sold Items</h2>
<div class="section">
    <input id="least_start" type="date">
    <input id="least_end" type="date">
    <button onclick="leastSold()">Get Least Sold</button>
</div>
<div id="least_result" class="result"></div>
    <div class="chart-container">
    <canvas id="least_chart"></canvas>
</div>


<h2>Monthly Data</h2>
<div class="section">
    <input id="monthPicker" type="month" placeholder="YYYY-MM">
    <button onclick="monthlyData()">Get Monthly Data</button>
</div>

<div id="monthly_result" class="result"></div>
<div class="chart-container">
    <canvas id="monthly_chart"></canvas>
</div>

</div>

<div id="toast-container"></div>

</body>
</html>
